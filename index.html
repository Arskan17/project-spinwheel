<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project spinwheel</title>
  <meta name="description" content="Spin a wheel of your projects to pick what to work on next.">
  <meta name="theme-color" content="#1F1A3D">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232C2557'/%3E%3Cpath d='M16 16V3a13 13 0 0 1 11.3 6.5z' fill='%23EF5B3E'/%3E%3Cpath d='M16 16l11.3-6.5a13 13 0 0 1 0 13z' fill='%23F2A541'/%3E%3Cpath d='M16 16l11.3 6.5A13 13 0 0 1 16 29z' fill='%232FA59A'/%3E%3Cpath d='M16 16v13a13 13 0 0 1-11.3-6.5z' fill='%234E86E4'/%3E%3Cpath d='M16 16L4.7 22.5a13 13 0 0 1 0-13z' fill='%23B76AD4'/%3E%3Cpath d='M16 16L4.7 9.5A13 13 0 0 1 16 3z' fill='%237FBF5A'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FFD166'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <h1>Project spinwheel</h1>
    <p class="tagline">Can’t choose what to work on next? Let the wheel decide.</p>
  </header>

  <main class="booth">
    <section class="stage" aria-label="Wheel">
      <div class="wheel" id="wheel">
        <canvas id="wheel-canvas" aria-hidden="true"></canvas>
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <button class="hub" id="spin" type="button">Spin</button>
        <p class="wheel-empty" id="wheel-empty" hidden>Add a project and it gets a slice here.</p>
      </div>
    </section>

    <div class="side" id="side">
      <form class="add" id="add-form" autocomplete="off">
        <label for="add-input">Add a project</label>
        <div class="add-row">
          <input id="add-input" name="project" maxlength="60" placeholder="Fix the bike, learn Rust…" enterkeyhint="done">
          <button type="submit">Add</button>
        </div>
        <p class="add-error" id="add-error" role="status"></p>
      </form>

      <section class="list-section" aria-labelledby="wheel-heading">
        <h2 id="wheel-heading">On the wheel <span class="count" id="wheel-count">0</span></h2>
        <ul class="wheel-list" id="wheel-list"></ul>
      </section>

      <section class="list-section" aria-labelledby="pile-heading">
        <h2 id="pile-heading">Working on &amp; done <span class="count" id="pile-count">0</span></h2>
        <p class="pile-empty" id="pile-empty">Picked projects land here as tickets.</p>
        <ul class="tickets" id="pile-list"></ul>
      </section>

      <p class="save-note" id="save-note">Saved in this browser.</p>
    </div>
  </main>

  <dialog class="result" id="result" aria-labelledby="result-name">
    <p class="result-lead">The wheel picked</p>
    <h2 class="result-name" id="result-name"></h2>
    <div class="result-actions">
      <button class="primary" id="result-keep" type="button" autofocus>Work on this</button>
      <button id="result-again" type="button">Spin again</button>
    </div>
  </dialog>

  <p class="visually-hidden" id="announce" aria-live="polite"></p>
</body>
</html>
